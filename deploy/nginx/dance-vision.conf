server {
    listen 80;
    listen [::]:80;

    server_name dance.example.com;

    root /srv/dance-vision/app/dist;
    index index.html;

    # Vite SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_buffering off;
    }

    # Temporary multiplayer song assets
    location /relay/assets/ {
        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Application limit is currently 100 MiB for one song-audio asset.
        client_max_body_size 110m;

        # Stream uploads instead of buffering the entire song in Nginx first.
        proxy_request_buffering off;
        proxy_buffering off;

        client_body_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Room-server health check
    location = /health {
        proxy_pass http://127.0.0.1:3001/health;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }
}