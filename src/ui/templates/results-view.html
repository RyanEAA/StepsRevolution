<section id="results-view" class="app-view results-view" aria-labelledby="results-title" hidden>
      <div class="results-card">
        <p class="eyebrow">
          Song complete
        </p>

        <h2 id="results-title">
          Results
        </h2>

        <div class="results-score">
          <span>Score</span>

          <strong id="results-score-value">
            0
          </strong>
        </div>

        <dl class="results-breakdown">

          <div>
            <dt>Perfect</dt>
            <dd id="results-perfect-count">0</dd>
          </div>

          <div>
            <dt>Great</dt>
            <dd id="results-great-count">0</dd>
          </div>

          <div>
            <dt>Good</dt>
            <dd id="results-good-count">0</dd>
          </div>

          <div>
            <dt>Miss</dt>
            <dd id="results-miss-count">0</dd>
          </div>

          <div>
            <dt>Max combo</dt>
            <dd id="results-max-combo">0</dd>
          </div>

        </dl>

        <section id="multiplayer-standings" class="multiplayer-standings" aria-labelledby="multiplayer-standings-title" hidden>
          <h3 id="multiplayer-standings-title">Room standings</h3>
          <ol id="multiplayer-standings-list" class="multiplayer-score-list"></ol>
        </section>

        <div class="results-actions">
          <button id="results-replay-button" type="button" class="primary-button">
            Play again
          </button>

          <button id="results-song-select-button" type="button" class="secondary-button">
            Choose another song
          </button>
        </div>
        <p id="multiplayer-results-status" class="session-status" aria-live="polite"></p>
      </div>
    </section>
