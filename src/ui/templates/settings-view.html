<section id="settings-view" class="app-view settings-view" aria-labelledby="settings-title" hidden>
  <header class="settings-header">
    <button id="settings-back-button" type="button" class="back-button">← Back</button>
    <div>
      <p class="eyebrow">Options</p>
      <h2 id="settings-title">Settings</h2>
      <p class="view-description">Tune input, camera, gameplay, and interface preferences. Changes save automatically on this device.</p>
    </div>
    <button id="settings-reset-button" type="button" class="secondary-button">Reset defaults</button>
  </header>

  <div class="settings-layout">
    <nav class="settings-tabs" aria-label="Settings sections">
      <button type="button" class="settings-tab settings-tab--active" data-settings-section="input">Input & Camera</button>
      <button type="button" class="settings-tab" data-settings-section="gameplay">Gameplay</button>
      <button type="button" class="settings-tab" data-settings-section="interface">Interface</button>
    </nav>

    <div class="settings-panels">
      <section class="settings-panel" data-settings-panel="input" aria-labelledby="settings-input-title">
        <div class="settings-panel__heading">
          <div>
            <p class="eyebrow">Input & Camera</p>
            <h3 id="settings-input-title">Foot tracking</h3>
          </div>
          <button id="open-calibration-button" type="button" class="primary-button">Calibrate camera</button>
        </div>

        <div class="settings-grid">
          <label class="setting-field">
            <span class="setting-field__label">Preferred input</span>
            <select id="settings-input-mode">
              <option value="keyboard">Keyboard</option>
              <option value="camera">Camera</option>
            </select>
            <small>Camera access is only requested when you enable or calibrate it.</small>
          </label>

          <label class="setting-field">
            <span class="setting-field__label">Camera device</span>
            <select id="settings-camera-device">
              <option value="">Default camera</option>
            </select>
            <small>Device names may appear after camera permission is granted.</small>
          </label>

          <label class="setting-toggle">
            <input id="settings-mirror-camera" type="checkbox" />
            <span>
              <strong>Mirror preview</strong>
              <small>Match the camera preview to a mirror.</small>
            </span>
          </label>

          <label class="setting-field setting-field--range">
            <span class="setting-field__label">Landmark visibility</span>
            <div class="setting-range-row">
              <input id="settings-visibility-threshold" type="range" min="0" max="1" step="0.05" />
              <output id="settings-visibility-threshold-value">0.50</output>
            </div>
            <small>Individual ankle, heel, and toe landmarks below this score are ignored.</small>
          </label>

          <label class="setting-field setting-field--range">
            <span class="setting-field__label">Input confidence</span>
            <div class="setting-range-row">
              <input id="settings-foot-confidence" type="range" min="0" max="1" step="0.05" />
              <output id="settings-foot-confidence-value">0.50</output>
            </div>
            <small>The combined foot estimate must reach this confidence before it can trigger game input.</small>
          </label>

          <label class="setting-field setting-field--range">
            <span class="setting-field__label">Inference FPS</span>
            <div class="setting-range-row">
              <input id="settings-inference-fps" type="range" min="5" max="30" step="1" />
              <output id="settings-inference-fps-value">15</output>
            </div>
            <small>Lower values reduce CPU/GPU and battery use on low-end devices.</small>
          </label>
        </div>
      </section>

      <section class="settings-panel" data-settings-panel="gameplay" aria-labelledby="settings-gameplay-title" hidden>
        <div class="settings-panel__heading">
          <div>
            <p class="eyebrow">Gameplay</p>
            <h3 id="settings-gameplay-title">Playfield</h3>
          </div>
        </div>

        <div class="settings-grid">
          <label class="setting-field setting-field--range">
            <span class="setting-field__label">Playfield width</span>
            <div class="setting-range-row">
              <input id="settings-playfield-width" type="range" min="400" max="1180" step="10" />
              <output id="settings-playfield-width-value">1180 px</output>
            </div>
            <small>Controls the maximum width of the gameplay field.</small>
          </label>
        </div>
      </section>

      <section class="settings-panel" data-settings-panel="interface" aria-labelledby="settings-interface-title" hidden>
        <div class="settings-panel__heading">
          <div>
            <p class="eyebrow">Interface</p>
            <h3 id="settings-interface-title">Display preferences</h3>
          </div>
        </div>

        <div class="settings-grid">
          <label class="setting-toggle">
            <input id="settings-show-diagnostics" type="checkbox" />
            <span>
              <strong>Show diagnostics</strong>
              <small>Show developer gameplay and camera performance information.</small>
            </span>
          </label>

          <label class="setting-toggle">
            <input id="settings-reduced-motion" type="checkbox" />
            <span>
              <strong>Reduced motion</strong>
              <small>Disable nonessential menu transitions and motion effects.</small>
            </span>
          </label>
        </div>
      </section>
    </div>
  </div>
</section>
