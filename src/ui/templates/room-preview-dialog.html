<dialog id="room-preview-dialog" class="room-preview-dialog" aria-labelledby="room-preview-title">
  <div class="room-preview-card">
    <button id="room-preview-close" class="room-preview-close" type="button" aria-label="Close shared preview">×</button>
    <img id="room-preview-artwork" class="room-preview-artwork" alt="" hidden>
    <p class="eyebrow">Host preview</p>
    <h2 id="room-preview-title">Song preview</h2>
    <p id="room-preview-artist"></p>
    <p id="room-preview-status" class="session-status" aria-live="polite">Loading preview…</p>
    <button id="room-preview-play" class="primary-button" type="button" hidden>Play preview</button>
    <audio id="room-preview-audio" preload="auto"></audio>
  </div>
</dialog>
